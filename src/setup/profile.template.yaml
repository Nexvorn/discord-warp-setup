# Discord-only via Cloudflare WARP (WireGuard). Generated by DiscordWARP-Setup __WG_STAMP__.
# Only Discord is sent to WARP; anything else that reaches Clash goes DIRECT.
# Rules: Discord app (by process path), Discord domains (any app), Discord IP ranges, browser media on Cloudflare Realtime.
find-process-mode: strict
ipv6: true

proxies:
  - name: WARP
    type: wireguard
    server: 162.159.192.1
    port: 2408
    ip: __WG_IPV4__
    ipv6: __WG_IPV6__
    private-key: __WG_PRIVATE_KEY__
    public-key: __WG_PEER_PUBLIC_KEY__
    allowed-ips: ['0.0.0.0/0', '::/0']
    udp: true
    mtu: 1280
    persistent-keepalive: 25
    remote-dns-resolve: true
    dns: [1.1.1.1, 1.0.0.1]
    # junk packets before the handshake (AmneziaWG); WARP ignores them, the ISP's WireGuard detection does not see a plain handshake.
    # Fixed an ISP WireGuard outage in testing (Turkey, 2026-11). s1-s4/h1-h4 must stay default for Cloudflare.
    amnezia-wg-option:
      jc: 4
      jmin: 40
      jmax: 70

proxy-groups:
  - name: DISCORD
    type: select
    proxies: [WARP]          # no DIRECT here: if WARP fails, Discord fails (no silent leak)

rules:
  # 1) Discord desktop app: everything it sends (TCP+UDP, any destination that reaches the TUN)
  - PROCESS-PATH-REGEX,(?i)\\AppData\\Local\\Discord\\,DISCORD
  # 2) Discord domains from any app (Chrome/Edge discord.com/app, etc.)
  - GEOSITE,discord,DISCORD
  - DOMAIN-SUFFIX,discord.com,DISCORD
  - DOMAIN-SUFFIX,discordapp.com,DISCORD
  - DOMAIN-SUFFIX,discordapp.net,DISCORD
  - DOMAIN-SUFFIX,discord.gg,DISCORD
  - DOMAIN-SUFFIX,discord.media,DISCORD
  - DOMAIN-SUFFIX,discordcdn.com,DISCORD
  - DOMAIN,discord-attachments-uploads-prd.storage.googleapis.com,DISCORD
  # 3) Discord-owned IP space (RIPE maintainer lir-us-discord1-1-MNT)
  - IP-CIDR,66.22.192.0/18,DISCORD,no-resolve
  - IP-CIDR,195.62.89.0/24,DISCORD,no-resolve
  - IP-CIDR6,2a0e:5940::/29,DISCORD,no-resolve
  # 4) Discord voice/video media on Cloudflare Realtime (seen: 104.29.147.x:1930x) - browsers only
  - AND,((IP-CIDR,104.28.0.0/15,no-resolve),(PROCESS-NAME-REGEX,(?i)^(chrome|msedge)\.exe$)),DISCORD
  - MATCH,DIRECT

dns:
  enable: true
  use-hosts: false                 # K19: hosts below apply only to mihomo's own dialing, not to answers for apps
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: whitelist     # ONLY Discord names get fake-IPs; all other names get real answers
  fake-ip-filter:
    - geosite:discord
    - +.discord.com
    - +.discordapp.com
    - +.discordapp.net
    - +.discord.gg
    - +.discord.media
    - +.discordcdn.com
    - +.discordstatus.com
    - +.discord.co
    - +.discord.dev
    - +.discord.gift
    - +.discord.new
    - +.dis.gd
    - discord-attachments-uploads-prd.storage.googleapis.com
  default-nameserver: [__WG_BOOTSTRAP_DNS__]
  nameserver: [dhcp://system]        # the PC's own router/ISP DNS, exactly as before
  direct-nameserver: [dhcp://system]

# K19 (2026-11-12): discord.com has no AAAA; reach its REST API over Cloudflare IPv6 so the WARP IPv6 egress
# (not the shared, Cloudflare-rate-limited IPv4 egress) is used. mihomo resolver checks hosts before the WARP resolver.
hosts:
  discord.com: 2606:4700::6810:65bd
